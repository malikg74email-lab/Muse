name: Build Release APK (Shaheen)

on:
  workflow_dispatch:

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0 ndk;27.0.12077973 cmake;3.22.1

      - name: Build Web Host UI assets
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Pack embedded runtimes (Node + Python)
        run: |
          sudo apt-get install -y patchelf
          bash tools/runtime-pack/build-runtime-pack.sh both
          bash tools/python-pack/build-python-pack.sh both

      # Signing design: no keystore is stored on GitHub by design. This workflow
      # intentionally builds with the keystore check skipped and explicit
      # version properties; the returned release APK is unsigned and must be
      # signed locally with Malik's dedicated Shaheen keystore, which is kept
      # off-GitHub. Do not upload or commit that keystore or its passwords.
      - name: Build release APK (unsigned; sign locally)
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease -PreleaseSkipKeystoreCheck=true -PshaheenUnsignedRelease=true -PversionName=1.0.0-shaheen -PversionCode=1000000

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
