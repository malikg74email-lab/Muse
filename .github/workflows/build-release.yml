name: Build Release APK (Shaheen)

on:
  workflow_dispatch:

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0 ndk;27.0.12077973 cmake;3.22.1

      - name: Build Web Host UI assets
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Pack embedded runtimes (Node + Python)
        run: |
          sudo apt-get install -y patchelf
          bash tools/runtime-pack/build-runtime-pack.sh both
          bash tools/python-pack/build-python-pack.sh both

      # Signing design: Malik's dedicated Shaheen keystore NEVER goes on GitHub.
      # Instead, this workflow generates a throwaway (ephemeral) keystore inside
      # the runner so AGP packages normally-signed release APKs under their
      # canonical names (an unsigned "-unsigned"-suffixed provider APK breaks
      # :app:syncA11yProviderApkRelease, whose @InputFile is the canonical
      # accessibility-provider-release.apk path). The ephemeral signature is
      # discarded: the returned APKs are re-signed locally with the dedicated
      # off-GitHub keystore before delivery, and re-signing replaces this
      # signature cleanly. The keystore and keystore.properties exist only in
      # the runner (both are also covered by .gitignore) and are never committed.
      - name: Create ephemeral CI keystore
        run: |
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/shaheen-ci.jks" -alias shaheen-ci -keyalg RSA -keysize 2048 -validity 3650 -storepass shaheen-ci-ephemeral -keypass shaheen-ci-ephemeral -dname "CN=Shaheen CI Ephemeral, O=AA Studio Creations, C=PK"

      - name: Write keystore.properties
        run: |
          cat > keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/shaheen-ci.jks
          storePassword=shaheen-ci-ephemeral
          keyAlias=shaheen-ci
          keyPassword=shaheen-ci-ephemeral
          EOF

      - name: Build release APK (ephemeral CI signature; re-signed locally)
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease -PversionName=1.0.0-shaheen -PversionCode=1000000

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
