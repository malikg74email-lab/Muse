name: Build APK (Shaheen)

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0 ndk;27.0.12077973 cmake;3.22.1

      - name: Build Web Host UI assets
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Pack embedded runtimes (Node + Python)
        run: |
          sudo apt-get install -y patchelf
          bash tools/runtime-pack/build-runtime-pack.sh both
          bash tools/python-pack/build-python-pack.sh both

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug -PreleaseSkipVersionCheck=true -PreleaseSkipKeystoreCheck=true

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
